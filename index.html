<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Promoções eShop BR</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          borderRadius: {
            lg: 'var(--radius)',
            md: 'calc(var(--radius) - 2px)',
            sm: 'calc(var(--radius) - 4px)',
          },
          colors: {
            border: 'hsl(var(--border))',
            input: 'hsl(var(--input))',
            ring: 'hsl(var(--ring))',
            background: 'hsl(var(--background))',
            foreground: 'hsl(var(--foreground))',
            card: {
              DEFAULT: 'hsl(var(--card))',
              foreground: 'hsl(var(--card-foreground))',
            },
            primary: {
              DEFAULT: 'hsl(var(--primary))',
              foreground: 'hsl(var(--primary-foreground))',
            },
            secondary: {
              DEFAULT: 'hsl(var(--secondary))',
              foreground: 'hsl(var(--secondary-foreground))',
            },
            muted: {
              DEFAULT: 'hsl(var(--muted))',
              foreground: 'hsl(var(--muted-foreground))',
            },
            accent: {
              DEFAULT: 'hsl(var(--accent))',
              foreground: 'hsl(var(--accent-foreground))',
            },
            destructive: {
              DEFAULT: 'hsl(var(--destructive))',
              foreground: 'hsl(var(--destructive-foreground))',
            },
          },
        },
      },
    }
  </script>
  <style>
    :root {
      --background: 221 39% 11%;
      --foreground: 210 40% 98%;
      --card: 215 28% 17%;
      --card-foreground: 210 40% 98%;
      --primary: 0 72% 51%;
      --primary-foreground: 0 0% 100%;
      --secondary: 215 19% 27%;
      --secondary-foreground: 210 40% 98%;
      --muted: 215 19% 27%;
      --muted-foreground: 218 11% 65%;
      --accent: 215 16% 32%;
      --accent-foreground: 210 40% 98%;
      --destructive: 0 63% 31%;
      --destructive-foreground: 210 40% 98%;
      --border: 215 14% 24%;
      --input: 215 14% 24%;
      --ring: 0 72% 51%;
      --radius: 0.75rem;
    }

    .pill-active {
      background-color: hsl(var(--primary));
      color: hsl(var(--primary-foreground));
      border-color: hsl(var(--primary));
    }
    .pill-inactive {
      background-color: transparent;
      color: hsl(var(--muted-foreground));
      border-color: hsl(var(--border));
    }
    .pill-inactive:hover {
      background-color: hsl(var(--accent));
      color: hsl(var(--accent-foreground));
    }

    .scrollbar-hide::-webkit-scrollbar { display: none; }
    .scrollbar-hide { scrollbar-width: none; }
  </style>
</head>
<body class="min-h-screen bg-background font-sans text-foreground antialiased">
  <div class="mx-auto max-w-6xl px-4 py-8">
    <header class="border-b border-border pb-6">
      <div class="flex flex-col gap-4 md:flex-row md:items-center md:justify-between">
        <div>
          <h1 class="text-3xl font-extrabold tracking-tight text-primary">eShop Tracker</h1>
          <p class="mt-1 text-sm text-muted-foreground">Ofertas ativas no Brasil</p>
        </div>
        <div class="flex flex-col gap-3 sm:flex-row">
          <div class="relative w-full sm:w-64">
            <svg class="pointer-events-none absolute left-3 top-1/2 h-4 w-4 -translate-y-1/2 text-muted-foreground" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
              <path stroke-linecap="round" stroke-linejoin="round" d="m21 21-4.35-4.35M11 19a8 8 0 1 1 0-16 8 8 0 0 1 0 16Z" />
            </svg>
            <input
              type="text"
              id="searchInput"
              placeholder="Filtrar por nome..."
              class="flex h-9 w-full rounded-md border border-input bg-transparent py-1 pl-9 pr-3 text-sm text-foreground shadow-sm outline-none transition-colors placeholder:text-muted-foreground focus-visible:border-ring focus-visible:ring-2 focus-visible:ring-ring/40"
            >
          </div>
          <div class="relative w-full sm:w-56">
            <select
              id="sortSelect"
              class="h-9 w-full appearance-none rounded-md border border-input bg-transparent py-1 pl-3 pr-8 text-sm text-foreground shadow-sm outline-none transition-colors focus-visible:border-ring focus-visible:ring-2 focus-visible:ring-ring/40"
            >
              <option value="discount_desc" class="bg-card text-foreground">Maior Desconto (%)</option>
              <option value="opportunity" class="bg-card text-foreground">Oportunidade</option>
              <option value="price_asc" class="bg-card text-foreground">Menor Preço</option>
              <option value="price_desc" class="bg-card text-foreground">Maior Preço</option>
              <option value="name_asc" class="bg-card text-foreground">Nome (A-Z)</option>
            </select>
            <svg class="pointer-events-none absolute right-3 top-1/2 h-4 w-4 -translate-y-1/2 text-muted-foreground" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
              <path stroke-linecap="round" stroke-linejoin="round" d="m6 9 6 6 6-6" />
            </svg>
          </div>
        </div>
      </div>

      <!-- Navegação por Pills -->
      <div class="mt-6 flex gap-2 overflow-x-auto pb-2 scrollbar-hide">
        <button id="pill-all" onclick="setFilter('all')" class="pill-active whitespace-nowrap rounded-full border px-5 py-2 text-sm font-semibold shadow-sm transition-colors">Todos (0)</button>
        <button id="pill-new" onclick="setFilter('new')" class="pill-inactive whitespace-nowrap rounded-full border px-5 py-2 text-sm font-semibold shadow-sm transition-colors">Novos (0)</button>
        <button id="pill-old" onclick="setFilter('old')" class="pill-inactive whitespace-nowrap rounded-full border px-5 py-2 text-sm font-semibold shadow-sm transition-colors">Anteriores (0)</button>
      </div>
    </header>

    <div id="grid" class="mt-8 grid grid-cols-1 gap-6 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4"></div>
    <div id="empty" class="hidden rounded-xl border border-dashed border-border py-20 text-center text-muted-foreground">Nenhuma oferta encontrada para este filtro.</div>
  </div>

  <script>
    let games = [];
    let currentFilter = 'all';

    // Termos usados para a ordenação "Oportunidade", por ordem de prioridade (tier) e,
    // dentro do tier 1, por ordem de grandeza (posição na lista).
    const OPPORTUNITY_TIERS = [
      ["Zelda", "Mario", "Hyrule", "Final Fantasy", "Kong", "Xenoblade", "Fire Emblem"],
      ["Pokémon", "Starfox", "Star Fox", "Kirby", "Metroid", "Smash Bros", "Castlevania", "Wario"],
      ["Yoshi", "Splatoon", "Animal Crossing", "Sonic"],
    ];

    function normalizeText(str) {
      return str
        .normalize('NFD')
        .replace(/[\u0300-\u036f]/g, '')
        .toLowerCase();
    }

    function getOpportunityRank(title) {
      const normTitle = normalizeText(title);
      for (let tier = 0; tier < OPPORTUNITY_TIERS.length; tier++) {
        const terms = OPPORTUNITY_TIERS[tier];
        for (let termIndex = 0; termIndex < terms.length; termIndex++) {
          if (normTitle.includes(normalizeText(terms[termIndex]))) {
            return { tier: tier + 1, termIndex };
          }
        }
      }
      return { tier: OPPORTUNITY_TIERS.length + 1, termIndex: -1 };
    }

    const grid = document.getElementById('grid');
    const searchInput = document.getElementById('searchInput');
    const sortSelect = document.getElementById('sortSelect');
    const empty = document.getElementById('empty');

    async function loadDeals() {
      try {
        const res = await fetch('data/deals.json');
        games = await res.json();
        games.forEach(g => { g._opportunityRandom = Math.random(); });

        // Atualiza os contadores das pills
        const countNew = games.filter(g => g.is_new).length;
        const countOld = games.filter(g => !g.is_new).length;

        document.getElementById('pill-all').innerText = `Todos (${games.length})`;
        document.getElementById('pill-new').innerText = `Novos (${countNew})`;
        document.getElementById('pill-old').innerText = `Anteriores (${countOld})`;

        render();
      } catch (err) {
        grid.innerHTML = '<p class="col-span-full text-center text-destructive">Erro ao carregar ofertas.</p>';
      }
    }

    window.setFilter = function(filter) {
      currentFilter = filter;
      ['all', 'new', 'old'].forEach(f => {
        const el = document.getElementById(`pill-${f}`);
        if (f === filter) {
          el.classList.replace('pill-inactive', 'pill-active');
        } else {
          el.classList.replace('pill-active', 'pill-inactive');
        }
      });
      render();
    }

    function render() {
      const term = searchInput.value.toLowerCase();
      const sort = sortSelect.value;

      let filtered = games.filter(g => g.title.toLowerCase().includes(term));

      if (currentFilter === 'new') filtered = filtered.filter(g => g.is_new);
      if (currentFilter === 'old') filtered = filtered.filter(g => !g.is_new);

      filtered.sort((a, b) => {
        const discountA = Math.round((1 - (a.price / a.old_price)) * 100);
        const discountB = Math.round((1 - (b.price / b.old_price)) * 100);

        if (sort === 'discount_desc') return discountB - discountA;
        if (sort === 'price_asc') return a.price - b.price;
        if (sort === 'price_desc') return b.price - a.price;
        if (sort === 'name_asc') return a.title.localeCompare(b.title);
        if (sort === 'opportunity') {
          const rankA = getOpportunityRank(a.title);
          const rankB = getOpportunityRank(b.title);
          if (rankA.tier !== rankB.tier) return rankA.tier - rankB.tier;
          if (rankA.termIndex !== rankB.termIndex) return rankA.termIndex - rankB.termIndex;
          // Dentro do mesmo termo (ou no grupo "todos os outros"), ordena aleatoriamente
          // usando um peso sorteado uma única vez no carregamento dos dados.
          return a._opportunityRandom - b._opportunityRandom;
        }
        return 0;
      });

      empty.classList.toggle('hidden', filtered.length > 0);

      grid.innerHTML = filtered.map(g => {
        const discount = Math.round((1 - (g.price / g.old_price)) * 100);
        const newBadge = g.is_new ? `<span class="ml-2 inline-flex items-center rounded-full bg-blue-500/15 px-2 py-0.5 text-xs font-bold text-blue-400 ring-1 ring-inset ring-blue-500/30">NOVO</span>` : '';

        return `
        <div class="relative flex flex-col justify-between rounded-xl border border-border bg-card p-5 text-card-foreground shadow-sm transition-colors hover:border-ring/50">
          <div>
            <div class="mb-3 flex items-start justify-between">
              <h2 class="pr-4 text-base font-semibold leading-snug">${g.title}</h2>
            </div>
            <div class="mb-1 flex items-center">
              <span class="text-2xl font-extrabold text-emerald-400">R$ ${g.price.toFixed(2)}</span>
              ${newBadge}
            </div>
            <div class="flex items-center gap-2 text-sm text-muted-foreground">
              <span class="line-through">R$ ${g.old_price.toFixed(2)}</span>
              <span class="inline-flex items-center rounded-full bg-destructive/15 px-2 py-0.5 text-xs font-semibold text-red-400 ring-1 ring-inset ring-destructive/30">-${discount}%</span>
            </div>
          </div>
          <a href="${g.url}" target="_blank" rel="noopener" class="mt-5 inline-flex h-9 items-center justify-center rounded-md bg-secondary px-4 text-sm font-semibold text-secondary-foreground shadow-sm transition-colors hover:bg-primary hover:text-primary-foreground">
            Ver na Loja
          </a>
        </div>
      `}).join('');
    }

    searchInput.addEventListener('input', render);
    sortSelect.addEventListener('change', render);
    loadDeals();
  </script>
</body>
</html>
